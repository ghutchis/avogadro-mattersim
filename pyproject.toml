[project]
authors = [{name = "Geoffrey Hutchison", email = "geoff.hutchison@gmail.com"}]
dependencies = ["avogadro>=2.1.0", "mattersim>=1.2.5,<2"]
license = "BSD-3-Clause"
name = "avogadro-mattersim"
requires-python = ">= 3.11"
version = "0.1.1"

[project.scripts]
avogadro-mattersim = "avogadro_mattersim:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/avogadro_mattersim"]

# .github/workflows/update-dependencies.yml checks PyPI / conda-forge daily for
# these packages and opens a PR raising their ">=" floors and the version.
[tool.update-dependencies]
track = ["avogadro", "mattersim"]

[tool.avogadro]
minimum-avogadro-version = "1.103"

[[tool.avogadro.energy-models]]
identifier = "MatterSim-1M"
model-name = "MatterSim-1M"
description = "Calculate MatterSim energies and gradients with 1M model"
input-format = "cjson"
protocol = "binary-v1"
support.gradients = true
support.elements = "1-89"
support.unit-cell = true
support.ions = true
support.radicals = true

[[tool.avogadro.energy-models]]
identifier = "MatterSim-5M"
model-name = "MatterSim-5M"
description = "Calculate MatterSim energies and gradients with 5M model"
input-format = "cjson"
protocol = "binary-v1"
support.gradients = true
support.elements = "1-89"
support.unit-cell = true
support.ions = true
support.radicals = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
avogadro_mattersim = { path = ".", editable = true }

[tool.pixi.tasks]
